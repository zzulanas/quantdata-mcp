[project]
name = "quantdata-mcp"
version = "0.4.0"
description = "MCP server for QuantData options market data — GEX/DEX/CEX/VEX walls, net drift, max pain, IV rank, and more"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Zachary Zulanas", email = "zzulanas@gmail.com"}]
keywords = [
    "mcp",
    "quantdata",
    "options",
    "trading",
    "gex",
    "dex",
    "options-flow",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.32.0",
    "mcp[cli]>=1.0.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]
dev = [
    "quantdata-mcp[test]",
    "ruff>=0.8",
    "mypy>=1.10",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/zzulanas/quantdata-mcp"
Repository = "https://github.com/zzulanas/quantdata-mcp"
Issues = "https://github.com/zzulanas/quantdata-mcp/issues"
Changelog = "https://github.com/zzulanas/quantdata-mcp/releases"

[project.scripts]
quantdata-mcp = "quantdata_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantdata_mcp"]

[tool.hatch.build.targets.sdist]
# Intentionally exclude `tests/` from the sdist published to PyPI:
# end-users installing the package don't need the test suite, and PyPI sdists
# conventionally ship only what's required to build/install. Contributors who
# want to run tests should clone the repo (where `tests/` lives at the root).
include = [
    "quantdata_mcp",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM", "RUF", "C4"]
ignore = ["E501"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
